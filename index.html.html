<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅行者の価格メモ</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#111;--mut:#666;--line:#d9d9d9;--acc:#0a7d4f;--onacc:#fff;--card:#f5f6f7;--err:#c0262d}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#eee;--mut:#9b9b9b;--line:#333;--acc:#3ecf8e;--onacc:#04210f;--card:#1c1c1c;--err:#ff6b70}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Hiragino Sans",sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 16px 56px}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
nav{display:flex;gap:6px;margin:8px 0 16px;overflow-x:auto}
nav button{flex:1;white-space:nowrap}
button,input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
input,select{width:100%}
button{cursor:pointer}
button.on,button.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
button.danger{color:var(--err);border-color:var(--err)}
button.link{border:0;background:none;color:var(--mut);padding:4px 0}
button.sm{padding:6px 10px;font-size:14px}
label{display:block;margin:14px 0 4px;font-size:14px;color:var(--mut)}
.card{background:var(--card);border-radius:12px;padding:12px 14px;margin:10px 0}
.big{font-size:22px;font-weight:700;margin-top:4px}
.sub,.msg{color:var(--mut);font-size:14px}
.err{color:var(--err)}
.tag{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
h2{font-size:17px;margin:24px 0 4px}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';

// ===== 設定（publishable key は公開前提の鍵。secret / service_role は絶対に入れない）=====
const SUPABASE_URL = 'https://tfazuhcbeospvrxwfnhb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ei7y0drodH90nYtzLFwghQ_Nitiw6TU';

const SHOP = { supermarket: 'スーパー', convenience: 'コンビニ', local: 'ローカル店', restaurant: '食堂・レストラン', street: '屋台', other: 'その他' };
const SRC = { onsite: '現地で投稿', recalled: '記憶から投稿' };

const $app = document.getElementById('app');

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
function sel(opts, val) {
  const s = h('select', {});
  opts.forEach(([v, l]) => s.append(h('option', { value: v }, l)));
  if (val != null) s.value = val;
  return s;
}
const fmt = (x) => Number(x).toLocaleString('ja-JP', { maximumFractionDigits: 2 });
const today = () => new Date().toLocaleDateString('sv-SE');
const cityLabel = (c) => `${c.countries.name_ja}・${c.name_ja}`;

if (SUPABASE_KEY.startsWith('PASTE')) {
  $app.append(h('p', { class: 'err' }, '設定が未完了です: SUPABASE_KEY が入っていません。'));
  throw new Error('SUPABASE_KEY not set');
}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let me = null, cities = [], items = [], tab = 'search';

// ===== 起動・認証 =====
async function boot() {
  const { data, error } = await sb.auth.getUser();
  if (error || !data.user) return renderAuth();
  await loadMe(data.user);
}

async function loadMe(user) {
  const { data, error } = await sb.from('profiles').select('id,role,is_banned').eq('id', user.id).maybeSingle();
  if (error || !data) return renderMsg('プロフィールを読み込めませんでした。ログインし直してください。', true);
  me = data;
  if (me.is_banned) return renderMsg('このアカウントは利用停止中です。', true);
  const [c, i] = await Promise.all([
    sb.from('cities').select('id,name_ja,countries(name_ja,currency)').order('id'),
    sb.from('items').select('id,name_ja,unit_ja').order('id')
  ]);
  if (c.error || i.error) return renderMsg('データを読み込めませんでした: ' + ((c.error || i.error).message), true);
  cities = c.data || [];
  items = i.data || [];
  render();
}

function renderMsg(text, withLogout) {
  $app.replaceChildren(
    h('p', { class: withLogout ? 'err' : '' }, text),
    withLogout ? h('button', { onclick: logout }, 'ログアウト') : null
  );
}

async function logout() {
  await sb.auth.signOut();
  me = null;
  renderAuth();
}

function renderAuth(msg) {
  const email = h('input', { type: 'email', placeholder: 'メールアドレス', autocomplete: 'email' });
  const pw = h('input', { type: 'password', placeholder: 'パスワード（8文字以上）', autocomplete: 'current-password' });
  const out = h('p', { class: 'msg' }, msg || '');
  async function go(mode) {
    if (!email.value.trim() || !pw.value) { out.textContent = 'メールとパスワードを入力してください。'; return; }
    out.textContent = '処理中…';
    const cred = { email: email.value.trim(), password: pw.value };
    const { data, error } = mode === 'up' ? await sb.auth.signUp(cred) : await sb.auth.signInWithPassword(cred);
    if (error) { out.textContent = '失敗: ' + error.message; return; }
    if (!data.session) { out.textContent = '確認メールを送りました。メール内のリンクを開いてから、ログインしてください。'; return; }
    boot();
  }
  $app.replaceChildren(
    h('h2', {}, '旅行者の価格メモ'),
    h('p', { class: 'sub' }, '旅行者が実際に払った価格を共有・検索するテスト版です。'),
    h('label', {}, 'メールアドレス'), email,
    h('label', {}, 'パスワード'), pw,
    h('div', { class: 'row' },
      h('button', { class: 'pri', onclick: () => go('in') }, 'ログイン'),
      h('button', { onclick: () => go('up') }, '新規登録')
    ),
    out
  );
}

// ===== 画面 =====
function render() {
  const tabs = [['search', '検索'], ['post', '投稿'], ['mine', '自分の投稿']];
  if (me.role === 'admin') tabs.push(['admin', '管理']);
  const nav = h('nav', {}, tabs.map(([k, l]) => h('button', { class: k === tab ? 'on' : '', onclick: () => { tab = k; render(); } }, l)));
  const top = h('header', {}, h('strong', {}, '旅行者の価格メモ'), h('button', { class: 'link', onclick: logout }, 'ログアウト'));
  const body = h('section', {});
  $app.replaceChildren(top, nav, body);
  const views = { search: viewSearch, post: viewPost, mine: viewMine, admin: viewAdmin };
  views[tab](body);
}

function viewSearch(el) {
  const city = sel(cities.map((c) => [c.id, cityLabel(c)]));
  const item = sel(items.map((i) => [i.id, i.name_ja]));
  const out = h('div', {});
  async function run() {
    out.replaceChildren(h('p', { class: 'sub' }, '検索中…'));
    const c = cities.find((x) => x.id == city.value);
    const it = items.find((x) => x.id == item.value);
    const { data, error } = await sb.rpc('price_stats', { p_city_id: Number(city.value), p_item_id: Number(item.value) });
    if (error) return out.replaceChildren(h('p', { class: 'err' }, '検索に失敗: ' + error.message));
    if (!data.length) return out.replaceChildren(h('p', {}, 'まだ投稿がありません。最初の1件を投稿してみてください。'));
    const cur = c.countries.currency;
    const rows = data.slice().sort((a, b) => (a.shop + a.source).localeCompare(b.shop + b.source));
    out.replaceChildren(
      ...rows.map((r) => h('div', { class: 'card' },
        h('b', {}, SHOP[r.shop] || r.shop), ' ', h('span', { class: 'tag' }, SRC[r.source] || r.source),
        h('div', { class: 'big' }, r.median == null ? `データ不足（${r.n}件）` : `${fmt(r.p25)}〜${fmt(r.p75)} ${cur}`),
        r.median != null ? h('div', { class: 'sub' }, `中央値 ${fmt(r.median)} ${cur} ・ ${r.n}件`) : null
      )),
      h('p', { class: 'sub' }, `1${it.unit_ja}あたりの価格。5件未満は価格帯を表示しません。`)
    );
  }
  el.append(
    h('label', {}, '都市'), city,
    h('label', {}, '商品'), item,
    h('div', { class: 'row' }, h('button', { class: 'pri', onclick: run }, '検索')),
    out
  );
}

function viewPost(el) {
  const city = sel(cities.map((c) => [c.id, cityLabel(c)]));
  const item = sel(items.map((i) => [i.id, `${i.name_ja}（1${i.unit_ja}）`]));
  const amount = h('input', { type: 'number', inputmode: 'decimal', min: '0', step: 'any', placeholder: '実際に払った合計金額' });
  const qty = h('input', { type: 'number', inputmode: 'decimal', min: '0', step: 'any', value: '1' });
  const shop = sel(Object.entries(SHOP));
  const src = sel(Object.entries(SRC));
  const date = h('input', { type: 'date', value: today() });
  const note = h('input', { type: 'text', maxlength: '200', placeholder: '任意（店名・状況など）' });
  const out = h('p', { class: 'msg' }, '');
  async function submit() {
    const a = Number(amount.value), q = Number(qty.value);
    if (!(a > 0) || !(q > 0)) { out.className = 'err'; out.textContent = '金額と数量は0より大きい数を入れてください。'; return; }
    const c = cities.find((x) => x.id == city.value);
    out.className = 'msg'; out.textContent = '送信中…';
    const { error } = await sb.from('price_posts').insert({
      city_id: Number(city.value), item_id: Number(item.value), amount: a, currency: c.countries.currency,
      quantity: q, shop_type: shop.value, source_type: src.value, paid_on: date.value, note: note.value.trim() || null
    });
    if (error) { out.className = 'err'; out.textContent = '投稿に失敗: ' + error.message; return; }
    amount.value = ''; note.value = ''; qty.value = '1';
    out.textContent = '投稿しました。ありがとうございます。';
  }
  el.append(
    h('label', {}, '都市'), city,
    h('label', {}, '商品'), item,
    h('label', {}, '払った金額（通貨は都市の国に合わせて自動で入ります）'), amount,
    h('label', {}, '数量（水2本まとめて払ったなら 2）'), qty,
    h('label', {}, '店のタイプ'), shop,
    h('label', {}, '投稿の種類（その場で入力 / 記憶から）'), src,
    h('label', {}, '払った日'), date,
    h('label', {}, 'メモ'), note,
    h('div', { class: 'row' }, h('button', { class: 'pri', onclick: submit }, '投稿する')),
    out
  );
}

async function viewMine(el) {
  el.append(h('p', { class: 'sub' }, '読み込み中…'));
  const { data, error } = await sb.from('price_posts')
    .select('id,amount,currency,quantity,paid_on,shop_type,source_type,cities(name_ja),items(name_ja)')
    .eq('user_id', me.id).order('created_at', { ascending: false }).limit(50);
  el.replaceChildren();
  if (error) return el.append(h('p', { class: 'err' }, '読み込みに失敗: ' + error.message));
  if (!data.length) return el.append(h('p', {}, 'まだ投稿がありません。'));
  data.forEach((r) => el.append(h('div', { class: 'card' },
    h('b', {}, `${r.cities.name_ja} / ${r.items.name_ja}`),
    h('div', {}, `${fmt(r.amount)} ${r.currency}（数量 ${fmt(r.quantity)}）`),
    h('div', { class: 'sub' }, `${r.paid_on} ・ ${SHOP[r.shop_type] || r.shop_type} ・ ${SRC[r.source_type] || r.source_type}`),
    h('div', { class: 'row' }, h('button', {
      class: 'danger sm', onclick: async () => {
        if (!confirm('この投稿を削除しますか？')) return;
        const res = await sb.from('price_posts').delete().eq('id', r.id).eq('user_id', me.id).select();
        if (res.error || !res.data.length) return alert('削除できませんでした');
        render();
      }
    }, '削除'))
  )));
}

// ===== 管理（画面を隠すのはUIだけ。実際の権限はDBのRLSが毎回判定する）=====
function audit(action, target, detail) {
  return sb.from('audit_log').insert({ admin_id: me.id, action, target: String(target), detail: detail || null });
}

async function viewAdmin(el) {
  if (me.role !== 'admin') return el.append(h('p', { class: 'err' }, '権限がありません。'));
  el.append(h('p', { class: 'sub' }, '読み込み中…'));
  const [p, u] = await Promise.all([
    sb.from('price_posts')
      .select('id,user_id,amount,currency,quantity,paid_on,shop_type,source_type,note,cities(name_ja),items(name_ja)')
      .order('created_at', { ascending: false }).limit(100),
    sb.from('profiles').select('id,role,is_banned,created_at').order('created_at', { ascending: false }).limit(200)
  ]);
  el.replaceChildren();
  if (p.error || u.error) return el.append(h('p', { class: 'err' }, '読み込みに失敗: ' + ((p.error || u.error).message)));

  el.append(h('h2', {}, `投稿一覧（新しい順 ${p.data.length}件）`));
  p.data.forEach((r) => el.append(h('div', { class: 'card' },
    h('b', {}, `${r.cities.name_ja} / ${r.items.name_ja}`),
    h('div', {}, `${fmt(r.amount)} ${r.currency}（数量 ${fmt(r.quantity)}）`),
    h('div', { class: 'sub' }, `${r.paid_on} ・ ${SHOP[r.shop_type] || r.shop_type} ・ ${SRC[r.source_type] || r.source_type} ・ 投稿者 ${r.user_id.slice(0, 8)}`),
    r.note ? h('div', { class: 'sub' }, r.note) : null,
    h('div', { class: 'row' },
      h('button', {
        class: 'sm', onclick: async () => {
          const v = prompt('新しい金額', r.amount);
          if (v === null) return;
          const n = Number(v);
          if (!(n > 0)) return alert('金額が正しくありません');
          const res = await sb.from('price_posts').update({ amount: n }).eq('id', r.id).select();
          if (res.error || !res.data.length) return alert('更新できませんでした');
          await audit('edit_post', r.id, { amount: n });
          render();
        }
      }, '金額を編集'),
      h('button', {
        class: 'danger sm', onclick: async () => {
          if (!confirm('この投稿を削除しますか？')) return;
          const res = await sb.from('price_posts').delete().eq('id', r.id).select();
          if (res.error || !res.data.length) return alert('削除できませんでした');
          await audit('delete_post', r.id, null);
          render();
        }
      }, '削除')
    )
  )));

  el.append(h('h2', {}, `ユーザー一覧（${u.data.length}人）`));
  u.data.forEach((r) => {
    const canToggle = r.role !== 'admin' && r.id !== me.id;
    el.append(h('div', { class: 'card' },
      h('b', {}, r.id.slice(0, 8)), ' ', h('span', { class: 'tag' }, r.role), r.is_banned ? h('span', { class: 'tag err' }, '停止中') : null,
      h('div', { class: 'sub' }, `登録 ${String(r.created_at).slice(0, 10)}`),
      canToggle ? h('div', { class: 'row' }, h('button', {
        class: (r.is_banned ? '' : 'danger ') + 'sm', onclick: async () => {
          const next = !r.is_banned;
          if (!confirm(next ? 'このユーザーを利用停止にしますか？' : '利用停止を解除しますか？')) return;
          const res = await sb.from('profiles').update({ is_banned: next }).eq('id', r.id).select();
          if (res.error || !res.data.length) return alert('更新できませんでした');
          await audit(next ? 'ban_user' : 'unban_user', r.id, null);
          render();
        }
      }, r.is_banned ? '停止を解除' : '利用停止にする')) : null
    ));
  });
}

boot();
</script>
</body>
</html>
